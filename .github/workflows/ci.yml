name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest -q

  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run mypy
        run: python -m mypy

  security-audit:
    name: Security audit (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run pip-audit
        run: |
          set -e

          for attempt in 1 2 3 4 5; do
            if python -m pip_audit \
                --skip-editable \
                --timeout 60; then
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "pip-audit failed after $attempt attempts"
              exit 1
            fi

            delay=$((attempt * 15))
            echo "pip-audit failed; retrying in ${delay}s..."
            sleep "$delay"
          done        